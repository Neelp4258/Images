<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Image Upload Portal</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            max-width: 600px;
            width: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #333;
            font-size: 28px;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
            font-size: 16px;
        }

        .upload-section {
            border: 3px dashed #ccc;
            border-radius: 15px;
            padding: 40px;
            text-align: center;
            margin-bottom: 30px;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .upload-section:hover {
            border-color: #667eea;
            background-color: #f8f9ff;
        }

        .upload-section.dragover {
            border-color: #667eea;
            background-color: #f0f4ff;
        }

        .upload-icon {
            font-size: 48px;
            color: #ccc;
            margin-bottom: 20px;
        }

        .upload-text {
            color: #666;
            font-size: 18px;
            margin-bottom: 20px;
        }

        .file-input {
            display: none;
        }

        .upload-btn {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .upload-btn:hover {
            transform: translateY(-2px);
        }

        .progress-section {
            display: none;
            margin-bottom: 30px;
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background-color: #e0e0e0;
            border-radius: 3px;
            overflow: hidden;
            margin-bottom: 10px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(45deg, #667eea, #764ba2);
            width: 0%;
            transition: width 0.3s ease;
        }

        .status-text {
            text-align: center;
            color: #666;
            font-size: 14px;
        }

        .result-section {
            display: none;
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
        }

        .result-section.success {
            background: #d4edda;
            border: 1px solid #c3e6cb;
        }

        .result-section.error {
            background: #f8d7da;
            border: 1px solid #f5c6cb;
        }

        .link-container {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 15px;
        }

        .link-input {
            flex: 1;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 14px;
            background: white;
        }

        .copy-btn {
            background: #28a745;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.2s ease;
        }

        .copy-btn:hover {
            background: #218838;
        }

        .preview-image {
            max-width: 100%;
            max-height: 200px;
            border-radius: 10px;
            margin-top: 15px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .reset-btn {
            background: #6c757d;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            margin-top: 15px;
            transition: background 0.2s ease;
        }

        .reset-btn:hover {
            background: #5a6268;
        }

        @media (max-width: 768px) {
            .container {
                padding: 20px;
                margin: 10px;
            }

            .header h1 {
                font-size: 24px;
            }

            .upload-section {
                padding: 30px 20px;
            }

            .link-container {
                flex-direction: column;
                align-items: stretch;
            }

            .copy-btn {
                margin-top: 10px;
            }
        }

        .loader {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🚀 GitHub Image Upload Portal</h1>
            <p>Upload images to GitHub and get instant Netlify links</p>
        </div>

        <div class="upload-section" id="uploadSection">
            <div class="upload-icon">📁</div>
            <div class="upload-text">Drop your image here or click to browse</div>
            <input type="file" id="fileInput" class="file-input" accept="image/*">
            <button class="upload-btn" onclick="document.getElementById('fileInput').click()">
                Choose Image
            </button>
        </div>

        <div class="progress-section" id="progressSection">
            <div class="loader"></div>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="status-text" id="statusText">Preparing upload...</div>
        </div>

        <div class="result-section" id="resultSection">
            <h3 id="resultTitle">Upload Successful! 🎉</h3>
            <p id="resultMessage">Your image has been uploaded successfully.</p>
            <img id="previewImage" class="preview-image" style="display: none;">
            <div class="link-container">
                <input type="text" id="linkInput" class="link-input" readonly placeholder="Generated link will appear here...">
                <button class="copy-btn" onclick="copyToClipboard()">📋 Copy</button>
            </div>
            <button class="reset-btn" onclick="resetUpload()">Upload Another</button>
        </div>
    </div>

    <script>
        // GitHub Configuration
        const GITHUB_TOKEN = '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';
        const GITHUB_USERNAME = 'Neelp4258';
        const GITHUB_REPO = 'Images';
        const NETLIFY_DOMAIN = 'https://mailingimg.netlify.app';

        // Elements
        const uploadSection = document.getElementById('uploadSection');
        const fileInput = document.getElementById('fileInput');
        const progressSection = document.getElementById('progressSection');
        const progressFill = document.getElementById('progressFill');
        const statusText = document.getElementById('statusText');
        const resultSection = document.getElementById('resultSection');
        const resultTitle = document.getElementById('resultTitle');
        const resultMessage = document.getElementById('resultMessage');
        const linkInput = document.getElementById('linkInput');
        const previewImage = document.getElementById('previewImage');

        // Drag and drop handlers
        uploadSection.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadSection.classList.add('dragover');
        });

        uploadSection.addEventListener('dragleave', () => {
            uploadSection.classList.remove('dragover');
        });

        uploadSection.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadSection.classList.remove('dragover');
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                handleFile(files[0]);
            }
        });

        uploadSection.addEventListener('click', () => {
            fileInput.click();
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleFile(e.target.files[0]);
            }
        });

        async function handleFile(file) {
            // Validate file type
            if (!file.type.startsWith('image/')) {
                showError('Please select a valid image file.');
                return;
            }

            // Validate file size (max 5MB)
            if (file.size > 5 * 1024 * 1024) {
                showError('File size must be less than 5MB.');
                return;
            }

            // Show progress
            showProgress();
            updateProgress(10, 'Reading file...');

            try {
                // Generate unique filename
                const timestamp = Date.now();
                const extension = file.name.split('.').pop().toLowerCase();
                const filename = `image_${timestamp}.${extension}`;

                updateProgress(30, 'Converting to base64...');

                // Convert to base64
                const base64Content = await fileToBase64(file);
                const base64Data = base64Content.split(',')[1]; // Remove data URL prefix

                updateProgress(50, 'Uploading to GitHub...');

                // Upload to GitHub
                const uploadResult = await uploadToGitHub(filename, base64Data);

                updateProgress(80, 'Generating link...');

                // Generate Netlify link
                const netlifyLink = `${NETLIFY_DOMAIN}/${filename}`;

                updateProgress(100, 'Upload complete!');

                // Show success
                setTimeout(() => {
                    showSuccess(netlifyLink, file, filename);
                }, 500);

            } catch (error) {
                console.error('Upload error:', error);
                showError(error.message || 'Upload failed. Please try again.');
            }
        }

        function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.onerror = () => reject(new Error('Failed to read file'));
                reader.readAsDataURL(file);
            });
        }

        async function uploadToGitHub(filename, base64Data) {
            const url = `https://api.github.com/repos/${GITHUB_USERNAME}/${GITHUB_REPO}/contents/${filename}`;
            
            const response = await fetch(url, {
                method: 'PUT',
                headers: {
                    'Authorization': `token ${GITHUB_TOKEN}`,
                    'Content-Type': 'application/json',
                    'Accept': 'application/vnd.github.v3+json'
                },
                body: JSON.stringify({
                    message: `Add image: ${filename}`,
                    content: base64Data,
                    branch: 'main'
                })
            });

            if (!response.ok) {
                const errorData = await response.json();
                throw new Error(errorData.message || `GitHub API Error: ${response.status}`);
            }

            return await response.json();
        }

        function showProgress() {
            uploadSection.style.display = 'none';
            resultSection.style.display = 'none';
            progressSection.style.display = 'block';
        }

        function updateProgress(percent, message) {
            progressFill.style.width = percent + '%';
            statusText.textContent = message;
        }

        function showSuccess(link, file, filename) {
            progressSection.style.display = 'none';
            resultSection.style.display = 'block';
            resultSection.className = 'result-section success';
            
            resultTitle.textContent = 'Upload Successful! 🎉';
            resultMessage.textContent = `Image "${filename}" uploaded successfully to GitHub and is now available via Netlify.`;
            linkInput.value = link;
            
            // Show preview
            const reader = new FileReader();
            reader.onload = (e) => {
                previewImage.src = e.target.result;
                previewImage.style.display = 'block';
            };
            reader.readAsDataURL(file);
        }

        function showError(message) {
            progressSection.style.display = 'none';
            resultSection.style.display = 'block';
            resultSection.className = 'result-section error';
            
            resultTitle.textContent = 'Upload Failed ❌';
            resultMessage.textContent = message;
            linkInput.value = '';
            previewImage.style.display = 'none';
        }

        function copyToClipboard() {
            linkInput.select();
            document.execCommand('copy');
            
            const copyBtn = document.querySelector('.copy-btn');
            const originalText = copyBtn.textContent;
            copyBtn.textContent = '✅ Copied!';
            copyBtn.style.background = '#28a745';
            
            setTimeout(() => {
                copyBtn.textContent = originalText;
                copyBtn.style.background = '#28a745';
            }, 2000);
        }

        function resetUpload() {
            uploadSection.style.display = 'block';
            progressSection.style.display = 'none';
            resultSection.style.display = 'none';
            fileInput.value = '';
            progressFill.style.width = '0%';
        }

        // Test GitHub connection on page load
        window.addEventListener('load', async () => {
            try {
                const response = await fetch(`https://api.github.com/repos/${GITHUB_USERNAME}/${GITHUB_REPO}`, {
                    headers: {
                        'Authorization': `token ${GITHUB_TOKEN}`,
                        'Accept': 'application/vnd.github.v3+json'
                    }
                });
                
                if (!response.ok) {
                    console.warn('GitHub connection test failed:', response.status);
                } else {
                    console.log('✅ GitHub connection verified');
                }
            } catch (error) {
                console.warn('GitHub connection test error:', error);
            }
        });
    </script>
</body>
</html>
